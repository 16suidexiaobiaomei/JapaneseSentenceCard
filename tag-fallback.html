<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shared Tag — Japanese Sentence Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f4ed">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f4ed;
    --card-bg: #faf9f5;
    --border: #e6e3d8;
    --dark: #141413;
    --accent: #c96442;
    --muted: #5e5d59;
    --muted-2: #b0aea5;
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: Geist, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--cream); font-family: var(--sans); color: var(--dark); }
  a { color: var(--accent); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 56px 24px 80px; text-align: center; }
  .badge { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 14px; background: var(--accent); color: #faf9f5; font-family: var(--serif); font-weight: 600; font-size: 15px; }
  h1 { margin: 20px 0 10px; font-family: var(--serif); font-size: 26px; letter-spacing: -.2px; }
  p { font-size: 15px; line-height: 1.7; color: var(--muted); }
  .btn { display: inline-block; margin-top: 22px; padding: 14px 28px; border-radius: 9999px; background: var(--accent); color: #faf9f5; font-size: 15px; font-weight: 500; text-decoration: none; }
  .back { display: inline-block; margin-top: 32px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">JSC</div>
  <h1>This is a shared Japanese flashcard tag</h1>
  <p>Open it in the Japanese Sentence Card app to see the cards, download it into your own collection, or grab the app first if you don't have it yet.</p>
  <a class="btn" href="https://apps.apple.com/app/id0000000000">Get the app</a>
  <div><a class="back" href="/">← Japanese Sentence Card</a></div>
</div>
</body>
</html>
